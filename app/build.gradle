plugins {
    id 'com.android.application'
}

android {
    namespace 'de.mrzpruefer'
    compileSdk 34

    defaultConfig {
        applicationId 'de.mrzpruefer.chip'
        minSdk 26          // java.time ohne Zusatzbibliothek
        targetSdk 34
        versionCode 21
        versionName '8.2'
        ndk {
            // nur echte Handys: 64-Bit-ARM und ältere 32-Bit-ARM
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {

            minifyEnabled true
            shrinkResources false
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    packaging {
        resources {
            // Doppelte Metadaten aus den Bouncy-Castle-Bibliotheken
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Texterkennung mit in die App eingebautem Modell – funktioniert ohne Internet
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Chipprüfung per NFC: JMRTD (bringt scuba-smartcards und Bouncy Castle mit),
    // Android-Adapter für den Kartenzugriff, Bouncy Castle CMS für die Signaturprüfung
    implementation 'org.jmrtd:jmrtd:0.8.0'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.18'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'

    testImplementation 'junit:junit:4.13.2'
}
